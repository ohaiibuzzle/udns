[package]
name = "udns"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
hickory-proto = "0.26.3"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "tls-ring", "https-ring", "webpki-roots"] }
http-body-util = "0.1.5"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
portable-atomic = "1.15.0"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
resolv-conf = "0.7.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "net", "io-util", "time", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.7"
ureq = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
